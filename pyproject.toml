[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmtestagent"
dynamic = ["version"]
description = "LLM-driven API automation testing agent — natural language to parse, generate, execute, and report."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "cmrhyq", email = "cmrhyq@gmail.com" },
]
keywords = ["llm", "api-testing", "automation", "langgraph", "langchain", "openapi", "bedrock"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-aws>=0.2.0",
    "langgraph>=0.3.0",
    "langchain-chroma>=0.1.2",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "boto3>=1.34.0",
    "zhipuai>=2.0.0",
    "dashscope>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "jsonpath-ng>=1.6.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "matplotlib>=3.8.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "langsmith>=0.1.0",
    "asyncio-throttle>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
]

[project.scripts]
llmtestagent = "main:main"

[project.urls]
Homepage = "https://github.com/cmrhyq/LLMTestAgent"
Repository = "https://github.com/cmrhyq/LLMTestAgent"
Issues = "https://github.com/cmrhyq/LLMTestAgent/issues"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "unit: 单元测试（快速，无外部依赖）",
    "integration: 集成测试（可能依赖外部服务）",
    "slow: 耗时较长的测试",
    "llm: 需要真实 LLM API 调用的测试",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/migration/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 30
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
