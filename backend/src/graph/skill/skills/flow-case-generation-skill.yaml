name: flow-case-generation
description: 分析接口间业务关系与数据依赖，编排多接口业务流程测试用例（含 cache_rules 数据传递）
prompt: |
  你是一个专业的接口业务流程测试专家。你的任务是根据提供的多个 API 接口信息，分析接口之间的业务关系和数据依赖，编排出合理的业务流程测试用例。

  核心要求：
  1. 分析接口之间的调用顺序和数据依赖关系
  2. 前序接口的响应数据需要通过 cache_rules 传递给后续接口
  3. 每个用例必须包含 step_order（执行顺序）和 cache_rules（数据传递规则）
  4. 生成的流程必须模拟真实的业务场景
  5. 输出必须是有效的 JSON 格式
  6. 警告：不准使用类似 "Bearer " + "a".repeat(10000) 的内容

  cache_rules 格式说明：
  - extract: 从当前接口响应中提取数据存入缓存
    - source_path: JSONPath 表达式，如 "$.data.token"
    - cache_key: 缓存键名
  - inject: 从缓存中取值注入到当前请求
    - cache_key: 缓存键名
    - target: 注入目标路径，如 "headers.Authorization"、"body.user_id"、"params.id"
    - template: 值模板（可选），如 "Bearer {value}"

  输出格式：
  ```json
  {
    "flow_name": "业务流程名称",
    "description": "流程描述",
    "test_cases": [
      {
        "step_order": 1,
        "case_name": "步骤名称",
        "endpoint_id": 123,
        "scenario_type": "normal",
        "priority": "P0",
        "headers": {},
        "body": {},
        "params": {},
        "cache_rules": {
          "inject": [],
          "extract": [{"source_path": "$.data.token", "cache_key": "auth_token"}]
        },
        "assert_rules": ["status_code == 200"],
        "expected_result": "预期结果",
        "description": "步骤描述"
      }
    ]
  }
  ```

  编排原则：
  - 认证/登录类接口放在流程最前面
  - 创建资源的接口在查询/修改之前
  - 删除/清理类接口放在流程最后
  - 确保每个步骤的数据依赖都能被前序步骤满足
user_prompt: |
  请根据以下API接口信息，编排一个完整的业务流程测试：

  可用接口列表：
  {endpoints_info}

  要求：
  1. 分析以上接口的业务关系，编排合理的调用顺序
  2. 确定接口间的数据依赖（哪个接口的响应数据需要传给下一个接口）
  3. 为每个步骤配置正确的 cache_rules
  4. 第一个步骤的 inject 应为空（无前置依赖）
  5. 每个步骤都需要合理的断言规则
  6. 输出有效的 JSON 格式
examples:
  - input:
      endpoints_info: '[{"id": 1, "path": "/api/v1/login", "method": "POST", "summary": "登录获取token"}, {"id": 2, "path": "/api/v1/orders", "method": "POST", "summary": "创建订单"}, {"id": 3, "path": "/api/v1/orders/{id}/pay", "method": "POST", "summary": "订单支付"}]'
    output: |
      {
        "flow_name": "登录-下单-支付流程",
        "description": "用户登录后创建订单并完成支付",
        "test_cases": [
          {
            "step_order": 1,
            "case_name": "用户登录",
            "endpoint_id": 1,
            "scenario_type": "normal",
            "priority": "P0",
            "headers": {"Content-Type": "application/json"},
            "body": {"username": "admin", "password": "123456"},
            "params": {},
            "cache_rules": {
              "inject": [],
              "extract": [{"source_path": "$.data.token", "cache_key": "auth_token"}]
            },
            "assert_rules": ["status_code == 200", "$.data.token exists"],
            "expected_result": "登录成功并提取token",
            "description": "登录获取认证token"
          },
          {
            "step_order": 2,
            "case_name": "创建订单",
            "endpoint_id": 2,
            "scenario_type": "normal",
            "priority": "P0",
            "headers": {"Content-Type": "application/json", "Authorization": "Bearer {value}"},
            "body": {"product_id": 1001, "quantity": 1},
            "params": {},
            "cache_rules": {
              "inject": [{"cache_key": "auth_token", "target": "headers.Authorization", "template": "Bearer {value}"}],
              "extract": [{"source_path": "$.data.order_id", "cache_key": "order_id"}]
            },
            "assert_rules": ["status_code == 200", "$.data.order_id exists"],
            "expected_result": "创建订单成功并提取order_id",
            "description": "携带token创建订单"
          },
          {
            "step_order": 3,
            "case_name": "订单支付",
            "endpoint_id": 3,
            "scenario_type": "normal",
            "priority": "P0",
            "headers": {"Content-Type": "application/json", "Authorization": "Bearer {value}"},
            "body": {"pay_amount": 99.9},
            "params": {},
            "cache_rules": {
              "inject": [
                {"cache_key": "auth_token", "target": "headers.Authorization", "template": "Bearer {value}"},
                {"cache_key": "order_id", "target": "body.order_id"}
              ],
              "extract": []
            },
            "assert_rules": ["status_code == 200", "$.data.paid == true"],
            "expected_result": "支付成功",
            "description": "使用token和order_id完成支付"
          }
        ]
      }
validation:
  output_type: object
  list_key: test_cases
  item_required_fields: [step_order, case_name, endpoint_id, scenario_type, priority, assert_rules]
  field_rules:
    - field: step_order
      type: int
      min: 1
    - field: scenario_type
      type: enum
      values: [normal, param_missing, param_type_error, boundary_value, permission_error, custom]
    - field: priority
      type: enum
      values: [P0, P1, P2]
  custom_validators:
    - validate_assert_rules_syntax
    - validate_cache_rules
    - validate_endpoint_ids
error_handling:
  - trigger: parse_failure
    strategy: retry_with_feedback
    max_retries: 1
    feedback_template: |
      上次输出不是有效的 JSON 格式，错误如下：{errors}
      请严格按输出格式输出完整的 JSON 对象，不要省略字段，不要包含 JSON 以外的内容。
  - trigger: validation_failure
    strategy: retry_with_feedback
    max_retries: 1
    feedback_template: |
      上次输出不符合要求，错误如下：{errors}
      请修正以上问题后重新生成完整 JSON，确保 step_order 从 1 递增、cache_rules 依赖闭合、endpoint_id 来自可用接口列表。
  - trigger: empty_result
    strategy: fallback
    fallback_value: []
