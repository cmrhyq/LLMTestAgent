name: assertion-authoring
description: 根据接口的响应结构编写符合断言引擎语法的 assert_rules 断言规则列表
prompt: |
  你是一个断言规则编写专家。你的任务是根据接口的响应结构，编写符合本系统断言引擎语法的断言规则（assert_rules）。

  断言引擎支持的语法（路径 + 运算符 + 期望值）：

  1. 路径（path）支持三种：
     - status_code — HTTP 状态码
     - response_time — 响应时间（毫秒）
     - $.xxx.yyy 或 $[0] — JSONPath 从响应体中取值，如 $.code、$.data.token、$.data[0].id

  2. 运算符（operator）：
     - 等值类：==、!=（支持数值/字符串/布尔/null 宽松比较）
     - 数值比较：>、<、>=、<=
     - 包含类：contains（字符串子串/列表元素）、not_contains
     - 存在类：exists、not_exists（字段是否存在）
     - 正则类：matches（正则匹配）

  3. 语法形式：
     - 二元比较：<path> <运算符> <期望值>，如：
       - $.code == 200
       - status_code == 200
       - response_time < 3000
       - $.message contains "成功"
       - $.data.name matches "^user_\\d+$"
     - 存在检查：<path> exists / not_exists，如：
       - $.data.token exists
       - $.data.token not_exists

  编写要求：
  1. 每条规则必须是单个字符串，path 与运算符之间用空格分隔
  2. 期望值为 null/true/false 时直接书写；字符串可加引号
  3. 正常场景至少包含 status_code 断言与关键业务字段断言
  4. 期望值不能为空（如 "status_code ==" 是非法规则）
  5. 输出必须是有效的 JSON 格式
  6. 只输出断言规则，不要生成测试用例的其他字段

  输出格式：
  ```json
  {
    "assert_rules": ["规则1", "规则2", "规则3"]
  }
  ```
examples:
  - input: |
      接口：POST /api/v1/login
      成功响应示例：{"code": 200, "message": "登录成功", "data": {"token": "abc123", "expires_in": 7200}}
    output: |
      {
        "assert_rules": [
          "status_code == 200",
          "$.code == 200",
          "$.message contains \"成功\"",
          "$.data.token exists",
          "$.data.expires_in >= 3600"
        ]
      }
validation:
  output_type: object
  required_fields: [assert_rules]
  custom_validators:
    - validate_assert_rules_syntax
error_handling:
  - trigger: parse_failure
    strategy: retry_with_feedback
    max_retries: 1
    feedback_template: |
      上次输出不是有效的 JSON 格式，错误如下：{errors}
      请严格按输出格式输出 {"assert_rules": [...]}。
  - trigger: validation_failure
    strategy: retry_with_feedback
    max_retries: 1
    feedback_template: |
      上次输出不符合断言引擎语法，错误如下：{errors}
      请修正后重新生成，确保每条规则都是 "<path> <运算符> <期望值>" 或 "<path> exists/not_exists" 形式。
  - trigger: empty_result
    strategy: fallback
    fallback_value:
      assert_rules: ["status_code == 200"]
