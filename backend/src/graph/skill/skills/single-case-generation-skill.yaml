name: single-case-generation
description: 根据单个 API 接口信息生成全面的单接口测试用例（正常/异常/边界场景）
prompt: |
  你是一个专业的测试用例专家。你的任务是根据提供的 API 信息，生成全面的测试用例。

  请遵循以下规则：
  1. 生成的用例必须覆盖正常场景、异常场景和边界值场景
  2. 每个用例必须包含完整的请求信息和断言规则
  3. 不允许增加新的断言规则
  4. 用例必须具有明确的预期结果
  5. 输出必须是有效的 JSON 格式
  6. 警告：不准使用类似 "Bearer " + "a".repeat(10000) 的内容

  用例场景类型：
  - normal: 正常场景，使用有效参数
  - param_missing: 参数缺失，移除必填参数
  - param_type_error: 参数类型错误，如字符串改为数字
  - boundary_value: 边界值，如空字符串、极值
  - permission_error: 权限异常，如无 token 或无效 token

  输出格式：
  ```json
  {
    "test_cases": [
      {
        "case_name": "用例名称",
        "scenario_type": "场景类型",
        "priority": "P0/P1/P2",
        "headers": {},
        "body": {},
        "assert_rules": ["断言规则"],
        "expected_result": "预期结果",
        "description": "用例描述"
      }
    ]
  }
  ```
user_prompt: |
  请为以下API生成测试用例：

  API名称: {name}
  API地址: {url}
  请求方法: {method}
  请求头: {headers}
  请求体: {body}
  查询参数: {params}
  现有断言规则: {assert_rules}
  优先级: {priority}
  描述: {description}

  请生成以下类型的测试用例：
  - 正常场景 (normal)
  - 参数缺失场景 (param_missing)
  - 参数类型错误场景 (param_type_error)
  - 边界值场景 (boundary_value)
  - 权限异常场景 (permission_error)

  要求：
  1. 正常场景用例优先级为P0
  2. 参数缺失和权限异常用例优先级为P1
  3. 参数类型错误和边界值用例优先级为P2
  4. 每种场景类型至少生成1个用例
  5. 对于请求体中的每个必填字段，生成一个参数缺失用例
  6. 输出有效的JSON格式
examples:
  - input:
      name: 用户登录
      url: https://api.example.com/api/v1/login
      method: POST
      headers: '{"Content-Type": "application/json"}'
      body: '{"username": "admin", "password": "123456"}'
      params: "无"
      assert_rules: '["status_code == 200", "$.code == 200"]'
      priority: P1
      description: 用户登录接口
    output: |
      {
        "test_cases": [
          {
            "case_name": "正常登录",
            "scenario_type": "normal",
            "priority": "P0",
            "headers": {"Content-Type": "application/json"},
            "body": {"username": "admin", "password": "123456"},
            "assert_rules": ["status_code == 200", "$.code == 200", "$.data.token exists"],
            "expected_result": "返回200，code=200，包含token",
            "description": "使用有效凭证正常登录"
          },
          {
            "case_name": "缺少密码参数",
            "scenario_type": "param_missing",
            "priority": "P1",
            "headers": {"Content-Type": "application/json"},
            "body": {"username": "admin"},
            "assert_rules": ["status_code == 400", "$.code == 400"],
            "expected_result": "返回400，提示缺少密码",
            "description": "移除必填参数password"
          }
        ]
      }
validation:
  output_type: object
  list_key: test_cases
  item_required_fields: [case_name, scenario_type, priority, assert_rules, expected_result]
  field_rules:
    - field: scenario_type
      type: enum
      values: [normal, param_missing, param_type_error, boundary_value, permission_error, custom]
    - field: priority
      type: enum
      values: [P0, P1, P2]
  custom_validators:
    - validate_assert_rules_syntax
error_handling:
  - trigger: parse_failure
    strategy: retry_with_feedback
    max_retries: 1
    feedback_template: |
      上次输出不是有效的 JSON 格式，错误如下：{errors}
      请严格按输出格式输出完整的 JSON 对象，不要省略字段，不要包含 JSON 以外的内容。
  - trigger: validation_failure
    strategy: retry_with_feedback
    max_retries: 1
    feedback_template: |
      上次输出不符合要求，错误如下：{errors}
      请严格按输出格式重新生成完整 JSON，修正以上问题，不要省略字段。
  - trigger: empty_result
    strategy: fallback
    fallback_value: []
