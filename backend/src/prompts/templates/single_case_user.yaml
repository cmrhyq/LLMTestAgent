prompt: |
  请为以下API生成测试用例：

  API名称: {name}
  API地址: {url}
  请求方法: {method}
  请求头: {headers}
  请求体: {body}
  查询参数: {params}
  现有断言规则: {assert_rules}
  优先级: {priority}
  描述: {description}

  请生成以下类型的测试用例：
  - 正常场景 (normal)
  - 参数缺失场景 (param_missing)
  - 参数类型错误场景 (param_type_error)
  - 边界值场景 (boundary_value)
  - 权限异常场景 (permission_error)

  要求：
  1. 正常场景用例优先级为P0
  2. 参数缺失和权限异常用例优先级为P1
  3. 参数类型错误和边界值用例优先级为P2
  4. 每种场景类型至少生成1个用例
  5. 对于请求体中的每个必填字段，生成一个参数缺失用例
  6. 输出有效的JSON格式
