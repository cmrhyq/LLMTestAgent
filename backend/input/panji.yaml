  /openapi/elastic-compute/v2/cells/{cellCode}/systems/autotestns0002/apps/autotestapp0620/workloads:
    post:
      tags:
        - 前置接口 - 系统应用创建
      summary: 应用服务创建部署
      description: 应用服务创建部署
      operationId: '8'
      parameters:
        - name: paas-app-service-version
          in: query
          schema:
            type: string
            example: v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      apiVersion:
                        type: string
                        example: v1
                      kind:
                        type: string
                        example: Service
                      metadata:
                        type: object
                        properties:
                          name:
                            type: string
                            example: autotest
                      spec:
                        type: object
                        properties:
                          ports:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  example: autotest
                                port:
                                  type: number
                                  example: 8080
                                protocol:
                                  type: string
                                  example: TCP
                                targetPort:
                                  type: number
                                  example: 8080
                            example:
                              - name: autotest
                                port: 8080
                                protocol: TCP
                                targetPort: 8080
                          selector:
                            type: object
                            properties:
                              name:
                                type: string
                                example: autotest
                              type:
                                type: string
                                example: deployment
                          sessionAffinity:
                            type: string
                            example: None
                          type:
                            type: string
                            example: ClusterIP
                  example:
                    - apiVersion: v1
                      kind: Service
                      metadata:
                        name: autotest
                      spec:
                        ports:
                          - name: autotest
                            port: 8080
                            protocol: TCP
                            targetPort: 8080
                        selector:
                          name: autotest
                          type: deployment
                        sessionAffinity: None
                        type: ClusterIP
                workload:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                      example: apps/v1
                    kind:
                      type: string
                      example: Deployment
                    metadata:
                      type: object
                      properties:
                        name:
                          type: string
                          example: autotest
                        namespace:
                          type: string
                          example: autotestns0002
                    spec:
                      type: object
                      properties:
                        selector:
                          type: object
                          properties:
                            matchLabels:
                              type: object
                              properties:
                                name:
                                  type: string
                                  example: autotest
                                type:
                                  type: string
                                  example: deployment
                        template:
                          type: object
                          properties:
                            metadata:
                              type: object
                              properties:
                                labels:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                      example: autotest
                                    type:
                                      type: string
                                      example: deployment
                            spec:
                              type: object
                              properties:
                                containers:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      image:
                                        type: string
                                        example: '{{image}}:{{imageName}}'
                                      imagePullPolicy:
                                        type: string
                                        example: IfNotPresent
                                      name:
                                        type: string
                                        example: container0
                                      ports:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            containerPort:
                                              type: number
                                              example: 8080
                                            name:
                                              type: string
                                              example: http
                                            protocol:
                                              type: string
                                              example: TCP
                                        example:
                                          - containerPort: 8080
                                            name: http
                                            protocol: TCP
                                      resources:
                                        type: object
                                        properties:
                                          limits:
                                            type: object
                                            properties:
                                              cpu:
                                                type: string
                                                example: 10000m
                                              memory:
                                                type: string
                                                example: 400Mi
                                          requests:
                                            type: object
                                            properties:
                                              cpu:
                                                type: string
                                                example: 5000m
                                              memory:
                                                type: string
                                                example: 200Mi
                                  example:
                                    - image: '{{image}}:{{imageName}}'
                                      imagePullPolicy: IfNotPresent
                                      name: container0
                                      ports:
                                        - containerPort: 8080
                                          name: http
                                          protocol: TCP
                                      resources:
                                        limits:
                                          cpu: 10000m
                                          memory: 400Mi
                                        requests:
                                          cpu: 5000m
                                          memory: 200Mi
            examples:
              应用服务创建部署:
                value:
                  services:
                    - apiVersion: v1
                      kind: Service
                      metadata:
                        name: autotest
                      spec:
                        ports:
                          - name: autotest
                            port: 8080
                            protocol: TCP
                            targetPort: 8080
                        selector:
                          name: autotest
                          type: deployment
                        sessionAffinity: None
                        type: ClusterIP
                  workload:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      name: autotest
                      namespace: autotestns0002
                    spec:
                      selector:
                        matchLabels:
                          name: autotest
                          type: deployment
                      template:
                        metadata:
                          labels:
                            name: autotest
                            type: deployment
                        spec:
                          containers:
                            - image: '{{image}}:{{imageName}}'
                              imagePullPolicy: IfNotPresent
                              name: container0
                              ports:
                                - containerPort: 8080
                                  name: http
                                  protocol: TCP
                              resources:
                                limits:
                                  cpu: 10000m
                                  memory: 400Mi
                                requests:
                                  cpu: 5000m
                                  memory: 200Mi
      responses:
        '200':
          description: ''
    parameters:
      - name: cellCode
        in: path
        required: true
        schema:
          type: string
