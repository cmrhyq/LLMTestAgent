                      query: >-
                        round(sum(rate(container_fs_writes_total{namespace="dada",
                        pod=~"yanshi0726-\w+-\w+$"}[2m]) ) by
                        (namespace,pod),0.01)
                      serverAddress: '{{prometheus}}'
                      threshold: '50'
                restoreToOriginalReplicaCount:
                  type: boolean
                  example: false
                workloadKind:
                  type: string
                  example: Deployment
                workloadName:
                  type: string
                  example: autotest
            examples:
