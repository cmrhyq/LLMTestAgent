      summary: 创建应用ScaledObject扩缩容
      description: 创建应用ScaledObject扩缩容
      operationId: scaledobject
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cooldownPeriod:
                  nullable: true
                  example: null
                maxReplicaCount:
                  type: number
                  example: 5
                minReplicaCount:
                  type: number
                  example: 1
                name:
                  type: string
                  example: testautoapi0620
                pollingInterval:
                  nullable: true
                  example: null
                prometheusTriggers:
                  type: array
                  items:
                    type: object
                    properties:
                      metricName:
                        type: string
                        example: storage_write_iops
                      query:
                        type: string
                        example: >-
                          round(sum(rate(container_fs_writes_total{namespace="dada",
                          pod=~"yanshi0726-\w+-\w+$"}[2m]) ) by
                          (namespace,pod),0.01)
                      serverAddress:
                        type: string
                        example: '{{prometheus}}'
                      threshold:
                        type: string
                        example: '50'
                  example:
