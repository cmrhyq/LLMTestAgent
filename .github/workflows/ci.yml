# ============================================================================
# GitHub Actions CI 工作流
# 触发条件：push 到 main 分支 或 针对 main 的 Pull Request
# 包含三个 Job：lint（代码检查）、test（单元测试）、build（打包验证）
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上的重复运行会自动取消前次，避免资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Job 1: 代码质量检查
  # 使用 ruff 进行 lint 规则检查和代码格式验证
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只安装 ruff，lint job 不需要安装项目全部依赖
      - name: Install ruff
        run: pip install ruff

      # 检查代码是否符合 ruff lint 规则（配置见 pyproject.toml [tool.ruff]）
      - name: Ruff check
        run: ruff check .

      # 检查代码格式是否一致（不会自动修改，仅报告差异）
      - name: Ruff format check
        run: ruff format --check .

  # --------------------------------------------------------------------------
  # Job 2: 单元测试
  # 在 Python 3.10 / 3.11 / 3.12 三个版本上并行运行 pytest
  # 生成覆盖率报告（仅 3.12 上传 artifact）
  # --------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false          # 某个版本失败不中断其他版本
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip             # 缓存 pip 下载，加速后续运行
          cache-dependency-path: pyproject.toml

      # 安装项目依赖 + 测试依赖
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"

      # 运行 pytest 并收集覆盖率数据，输出 XML 报告和终端摘要
      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing

      # 仅在 Python 3.12 上上传覆盖率报告（避免重复上传）
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # --------------------------------------------------------------------------
  # Job 3: 打包验证（当前项目为应用工具，暂不需要发布到 PyPI，故注释）
