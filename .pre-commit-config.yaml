# Pre-commit hooks for IntelligentTrading.
#
# Bootstrap (run once after `git clone`):
#     uv sync --extra dev
#     uv run pre-commit install
#
# Aligned with sibling repo US-Stock-Analysis. Hooks are wired as
# `repo: local` and shell out to `uv run` so the hook version is always
# identical to whatever is locked in pyproject.toml / uv.lock — and it
# avoids pre-commit having to download per-rev tool environments at
# install time, which fails on locked-down corporate networks.
#
# Notes:
#   * gitleaks is gated to `stages: [manual]` because the upstream binary
#     download is not reachable from some corporate environments. Run it
#     from a machine with public internet via:
#         uv run pre-commit run --hook-stage manual gitleaks --all-files
#   * detect-secrets is the always-on baseline-aware secret scanner.
#   * mypy is invoked WITHOUT --strict here even though pyproject.toml
#     has `strict = true`. Rationale: keep --strict in pyproject.toml so
#     new modules can be authored under strict typing, while pre-commit
#     runs the looser baseline (still catches real type errors).

repos:
  # ---------------------------------------------------------------------
  # Generic hygiene
  # ---------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^tests/fixtures/.*\.json$
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ---------------------------------------------------------------------
  # Secret scanning — gitleaks (manual stage only; needs public internet)
  # ---------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [manual]

  # ---------------------------------------------------------------------
  # Secret scanning — detect-secrets (baseline-aware, always on)
  # ---------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - "--baseline"
          - ".secrets.baseline"
        exclude: |
          (?x)^(
              uv\.lock|
              \.secrets\.baseline|
              tests/fixtures/.*\.json
          )$

  # ---------------------------------------------------------------------
  # Lint + format — ruff (driven by the project venv via `uv run` so the
  # hook version is always identical to the one used by developers / CI).
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, --fix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  # ---------------------------------------------------------------------
  # Type check — mypy (only on src/, tests are looser).
  # NOTE: deliberately NOT --strict here even though pyproject.toml is
  # strict. New modules can opt into strict via direct `uv run mypy`.
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy (non-strict on src/)
        entry: uv run mypy --ignore-missing-imports --no-strict-optional
        language: system
        types: [python]
        files: ^src/
        require_serial: true
        pass_filenames: false
        args: ["src/"]

  # ---------------------------------------------------------------------
  # Local sanity hook — block the .gitignore footgun where uv.lock would
  # be excluded by an over-broad lock glob.
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ensure-uv-lock-tracked
        name: ensure uv.lock is tracked
        entry: scripts/ensure-uv-lock-tracked.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # ---------------------------------------------------------------------
  # Markdown lint — markdownlint-cli2 via npx. Wired as `repo: local` so
  # pre-commit does not have to clone the upstream repo at install time
  # (the same offline-network constraint that drives ruff/mypy/detect-secrets
  # above). npx caches the package on first run against the existing system
  # Node toolchain.
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 (--fix)
        entry: npx --yes markdownlint-cli2 --fix
        language: system
        types: [markdown]
        require_serial: true

  # ---------------------------------------------------------------------
  # Custom credential / personal-data tripwire (.githooks/pre-commit).
  #
  # Belt + suspenders alongside detect-secrets:
  #   - detect-secrets handles entropy / known-token formats
  #   - this script handles project-specific patterns (account tails,
  #     RSU grant IDs, HK/CN bank account numbers, OAuth tokens) that
  #     detect-secrets does not know about.
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: legacy-tripwire
        name: legacy-tripwire (.githooks/pre-commit credential scan)
        entry: bash .githooks/pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
