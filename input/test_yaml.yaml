openapi: 3.0.3
info:
  title: JSONPlaceholder API
  description: 用户及文章相关接口集合
  version: 1.0.0
servers:
  - url: https://jsonplaceholder.dev.com
    description: JSONPlaceholder 测试服务器
  - url: https://jsonplaceholder.typicode.com
    description: JSONPlaceholder 测试服务器

paths:
  /users:
    get:
      operationId: user_list
      summary: 用户列表接口
      description: 用户列表接口，展示拥有的用户
      tags:
        - Users
      parameters:
        - name: Abc
          in: header
          required: true
          schema:
            type: string
            default: json
      responses:
        '200':
          description: 成功返回用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
              examples:
                default:
                  value:
                    - id: 1
                      username: Bret
      x-priority: P0
      x-cache-rules:
        id: $[0].id
      x-assert-rules:
        - $[0].username == Bret
        - $[0].id == 1

  /users/{id}:
    get:
      operationId: get_user_by_id
      summary: 根据 ID 获取用户信息
      description: 根据 ID 获取用户信息
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID（从缓存 cache:id 获取）
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: 成功返回用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  value:
                    id: 1
                    username: Bret
      x-priority: P0
      x-cache-rules:
        username: $.username
      x-assert-rules:
        - $.username == Bret
        - $.id == 1

  /users/{id}/posts:
    get:
      operationId: get_user_posts
      summary: 获取指定用户的文章列表
      description: 根据 ID 获取用户的文章列表
      tags:
        - Users
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID（从缓存 cache:id 获取）
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: 成功返回用户的文章列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
              examples:
                default:
                  value:
                    - id: 1
                      userId: 1
                      title: sample title
                      body: sample body
      x-priority: P0
      x-cache-rules:
        username: $.username
      x-assert-rules:
        - $[0].id == 1

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Leanne Graham
        username:
          type: string
          example: Bret
        email:
          type: string
          format: email
          example: Sincere@april.biz
        phone:
          type: string
        website:
          type: string
    Post:
      type: object
      properties:
        userId:
          type: integer
          example: 1
        id:
          type: integer
          example: 1
        title:
          type: string
        body:
          type: string